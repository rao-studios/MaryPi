; Apple's virtio sound device as the MaryOS VM sees it (distro/overlay-vm): PCM 0 plays to the
; Mac's output, and PCM 1, there with `maryos vm run --microphone`, records the Mac's input.
; PipeWire's default profile set tries only device 0 in both directions, so the microphone
; never became a source. This one names each device; 51-maryos-vm.lua hands it to the card
; ALSA calls "VirtIO SoundCard". Without --microphone there is no PCM 1, and the card has only
; its output profile.

[General]
auto-profiles = yes

[Mapping output]
description = Output
device-strings = hw:%f,0
channel-map = front-left,front-right
paths-output = analog-output
priority = 10
direction = output

[Mapping microphone]
description = Microphone
device-strings = hw:%f,1
channel-map = front-left,front-right
paths-input = analog-input
priority = 10
direction = input

[Mapping microphone-mono]
description = Microphone
device-strings = hw:%f,1
channel-map = mono
paths-input = analog-input
priority = 5
direction = input
