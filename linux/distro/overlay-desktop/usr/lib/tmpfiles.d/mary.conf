# Mary's runtime directories, made at boot before either service starts. sewnd and threadd
# each reach the other's socket (ReadWritePaths on the other's /run directory), and a
# directory that does not exist yet fails a service's mount namespace — whichever of the
# two started first would fail once and be restarted. Both exist from the start instead.
d /run/sewn   0750 sewn   sewn   -
d /run/thread 0750 thread thread -
