# MaryOS: everything that makes this image different from stock Ubuntu starts
# here. Sourced by the builder (POSIX sh) and parsed by MaryOSKit, so keep it
# to KEY=VALUE lines, "#" comments and optional double quotes.

# Identity. DISTRO_ID is used for file names, os-release ID and the hostname
# default; DISTRO_NAME is what people see. The version and codename are
# MaryOS's own (0.0 "Liquid Platinum" is the first) and are what os-release and
# `lsb_release` report; the Ubuntu base below stays in UBUNTU_CODENAME for
# tools that build apt suite names from it.
DISTRO_NAME=MaryOS
DISTRO_ID=maryos
DISTRO_VERSION=0.0
DISTRO_CODENAME=liquid-platinum
DISTRO_CODENAME_PRETTY="Liquid Platinum"
DISTRO_HOME_URL=https://github.com/rao-studios/MaryPi

# The Ubuntu base the rootfs is bootstrapped from. arm64 lives on
# ports.ubuntu.com, not archive.ubuntu.com.
BASE_SUITE=noble
BASE_MIRROR=http://ports.ubuntu.com/ubuntu-ports
BASE_COMPONENTS="main restricted universe multiverse"
ARCH=arm64

# First user, created at build time with sudo rights. Change the password on
# first login; it is in this file for everyone to read.
DEFAULT_USER=mary
DEFAULT_PASSWORD=maryos
HOSTNAME=maryos
LOCALE=en_US.UTF-8
TIMEZONE=UTC

# Disk layout. Partition 1 is FAT32 (the Raspberry Pi firmware reads it and
# it is mounted at /boot/firmware), partition 2 is the ext4 root. The root
# partition grows to the whole card or disk on first boot.
BOOT_LABEL=MARYOS
ROOT_LABEL=maryos-root
BOOT_PARTITION_MIB=512
ROOT_MIN_MIB=2048
VM_DISK_GIB=8
