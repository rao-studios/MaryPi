# MaryPi VM profile: QEMU "virt" with a GICv2, the same interrupt controller
# family as the Raspberry Pi 5 (GIC-400). Read by vm/run.sh (sourced as sh)
# and by MaryPiKit's VMProfile. hvf cannot emulate a GICv2, so on macOS this
# profile always runs on TCG; use qemu-virt-gicv3 for hardware acceleration.
VM_NAME=qemu-virt
VM_MACHINE=virt
VM_GIC=2
VM_MACHINE_OPTS=acpi=off
VM_CPU_TCG=cortex-a76
VM_CPU_HW=host
VM_SMP=1
VM_MEMORY_MIB=2048
VM_DISK_DEVICE=virtio-blk-device
VM_DEVICES="ramfb qemu-xhci usb-kbd usb-tablet"
VM_EXTRA_ARGS=""
