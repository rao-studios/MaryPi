# MaryPi VM profile: QEMU "virt" with a GICv3. This is the fast path: hvf on
# Apple Silicon and kvm on Linux hosts with a GICv3 (most modern boards).
# The ravynOS kernel drives GICv3 through pexpert/arm/pe_gicv3.c.
VM_NAME=qemu-virt-gicv3
VM_MACHINE=virt
VM_GIC=3
VM_MACHINE_OPTS=acpi=off
VM_CPU_TCG=cortex-a76
VM_CPU_HW=host
VM_SMP=1
VM_MEMORY_MIB=2048
VM_DISK_DEVICE=virtio-blk-device
VM_DEVICES="ramfb qemu-xhci usb-kbd usb-tablet"
VM_EXTRA_ARGS=""
